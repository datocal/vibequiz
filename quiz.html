<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Take a quiz and test your knowledge">
    <title>Fast Quiz - Take Quiz</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="back-link">&larr; Back to Quizzes</a>
            <h1 class="header__title" id="quizTitle">Quiz</h1>
            <div class="progress-bar">
                <div class="progress-bar__fill" id="progressBar"></div>
            </div>
            <p class="progress-text" id="progressText">Question 1 of 10</p>
        </header>

        <main class="main">
            <div id="quizContainer" class="quiz-container">
                <div class="loading">Loading quiz...</div>
            </div>

            <div id="resultsContainer" class="results-container" style="display: none;">
                <div class="results-card">
                    <h2 class="results__title">Quiz Complete!</h2>
                    <div class="results__score">
                        <span class="score-label">Your Score:</span>
                        <span class="score-value" id="finalScore">0/0</span>
                        <span class="score-percentage" id="scorePercentage">0%</span>
                    </div>
                    <div class="results__message" id="resultsMessage"></div>
                    <div class="results__actions">
                        <button class="btn btn--primary" id="retryBtn">Retry Quiz</button>
                        <a href="index.html" class="btn btn--secondary">Choose Another Quiz</a>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2025 Fast Quiz. Built with vanilla JavaScript.</p>
        </footer>
    </div>

    <script type="module" src="js/quiz.js"></script>
</body>
</html>
